<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password | Sabi Alaga</title>
  <style>
    :root { --maroon:#5c1a2e; --gold:#c9a227; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia,'Times New Roman',serif; background:#faf7f2; color:#2b2b2b;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border:1px solid #e8e0d4; border-radius:12px; padding:40px;
            max-width:420px; width:92%; box-shadow:0 8px 30px rgba(92,26,46,.08); }
    h1 { font-size:24px; margin:0 0 6px; color:var(--maroon); }
    p.sub { margin:0 0 24px; color:#7a6f63; font-size:15px; line-height:1.5; }
    label { display:block; font-size:13px; color:#5c5347; margin:14px 0 6px; }
    input { width:100%; padding:12px 14px; border:1px solid #d8cdbd; border-radius:8px;
            font-size:15px; background:#fffdf9; }
    input:focus { outline:2px solid var(--gold); border-color:var(--gold); }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:8px;
             background:var(--maroon); color:#fff; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; font-size:14px; line-height:1.5; display:none; }
    .msg.err { color:#a3341f; display:block; }
    .msg.ok  { color:#2e6b3f; display:block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">Choose a new password for your Sabi Alaga account.</p>

    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" minlength="8" required autocomplete="new-password" />
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" minlength="8" required autocomplete="new-password" />
      <button id="btn" type="submit">Update password</button>
    </form>

    <p class="msg" id="msg"></p>
    <p class="msg" id="done">Your password has been updated. You can <a href="/">sign in</a> now.</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const done = document.getElementById("done");
    const btn = document.getElementById("btn");

    if (!token) {
      form.style.display = "none";
      msg.className = "msg err";
      msg.textContent = "This link is missing its reset key. Please request a new password reset email.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg"; msg.textContent = "";
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;
      if (pw !== pw2) {
        msg.className = "msg err"; msg.textContent = "The two passwords do not match.";
        return;
      }
      btn.disabled = true; btn.textContent = "Updating...";
      try {
        const res = await fetch("/.netlify/functions/reset-confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: pw }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          form.style.display = "none";
          done.className = "msg ok";
        } else {
          msg.className = "msg err";
          msg.textContent = data.error || "Could not update the password. Please try again.";
        }
      } catch {
        msg.className = "msg err";
        msg.textContent = "Something went wrong. Please check your connection and try again.";
      }
      btn.disabled = false; btn.textContent = "Update password";
    });
  </script>
</body>
</html>
