<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password | Sabi Alaga</title>
  <style>
    :root { --maroon:#5c1a2e; --gold:#c9a227; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia,'Times New Roman',serif; background:#faf7f2; color:#2b2b2b;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border:1px solid #e8e0d4; border-radius:12px; padding:40px;
            max-width:420px; width:92%; box-shadow:0 8px 30px rgba(92,26,46,.08); }
    h1 { font-size:24px; margin:0 0 6px; color:var(--maroon); }
    p.sub { margin:0 0 24px; color:#7a6f63; font-size:15px; line-height:1.5; }
    input { width:100%; padding:12px 14px; border:1px solid #d8cdbd; border-radius:8px;
            font-size:15px; background:#fffdf9; }
    input:focus { outline:2px solid var(--gold); border-color:var(--gold); }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:8px;
             background:var(--maroon); color:#fff; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; font-size:14px; line-height:1.5; display:none; }
    .msg.err { color:#a3341f; display:block; }
    .msg.ok  { color:#2e6b3f; display:block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email on your Sabi Alaga account and we will send you a reset link.</p>

    <form id="form">
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
      <button id="btn" type="submit">Send reset link</button>
    </form>

    <p class="msg" id="msg"></p>
  </div>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg"; msg.textContent = "";
      btn.disabled = true; btn.textContent = "Sending...";
      try {
        const res = await fetch("/.netlify/functions/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value.trim() }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          msg.className = "msg ok";
          msg.textContent = data.message || "If that email has an account, a reset link is on its way.";
        } else {
          msg.className = "msg err";
          msg.textContent = data.error || "Could not send the reset email. Please try again.";
        }
      } catch {
        msg.className = "msg err";
        msg.textContent = "Something went wrong. Please check your connection and try again.";
      }
      btn.disabled = false; btn.textContent = "Send reset link";
    });
  </script>
</body>
</html>
